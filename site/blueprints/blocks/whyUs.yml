name: Why Us
icon: star
preview: fields
wysiwyg: true

fields:
  eyebrow:
    label: Eyebrow
    type: text
    default: WHY US

  heading:
    label: Heading
    type: text
    default: A Smarter Way to Improve

  image:
    label: Image
    type: files
    max: 1
    layout: cards
    query: page.files
    uploads:
      template: image

  items:
    label: Why Us Items
    type: structure
    min: 1
    columns:
      number:
        width: 1/6
      title:
        width: 1/3
      description:
        width: 1/2
    fields:
      number:
        label: Number
        type: text
        width: 1/4
        default: "01"

      title:
        label: Title
        type: text
        width: 3/4
        required: true

      description:
        label: Description
        type: textarea
        size: small
        buttons: false
        required: true
