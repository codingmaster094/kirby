name: Coach
icon: user
preview: fields
wysiwyg: true

fields:
  image:
    label: Coach Image
    type: files
    max: 1
    layout: cards
    query: page.files
    uploads:
      template: image

  eyebrow:
    label: Eyebrow
    type: text
    default: Meet the Coach

  heading:
    label: Heading
    type: textarea
    buttons: false
    default: Built on Experience. Driven by Purpose.

  description:
    label: Description
    type: textarea
    buttons: false
    help: Coaching philosophy, experience, and how athletes work with you.

  highlights:
    label: Credibility highlights
    type: structure
    help: Short bullets for experience, methodology, or athlete focus.
    fields:
      text:
        label: Highlight
        type: text
        required: true

  certifications:
    label: Certifications
    type: structure
    fields:
      name:
        label: Certification
        type: text
        required: true

  primaryText:
    label: Primary button text
    type: text
    width: 1/2
    default: Book a Free Strategy Call

  primaryLink:
    label: Primary button link
    type: link
    width: 1/2
