name: Client Transformations
icon: users
preview: fields
wysiwyg: true

fields:
  eyebrow:
    label: Eyebrow
    type: text
    default: Athlete Results

  heading:
    label: Heading
    type: text
    default: Athlete Case Studies

  description:
    label: Intro
    type: textarea
    size: small
    buttons: false
    help: Optional short intro above the case studies.

  items:
    label: Case studies
    type: structure
    min: 1
    max: 3
    help: Feature up to 3 strong stories. Layout alternates automatically.
    columns:
      title:
        width: 2/3
      image:
        width: 1/3
    fields:
      title:
        label: Card title
        type: text
        required: true
        placeholder: From inconsistent training to race-ready

      athlete:
        label: Athlete
        type: text
        placeholder: Recreational half-marathoner

      goal:
        label: Goal
        type: text
        placeholder: Finish stronger and stay injury-resilient

      challenge:
        label: Challenge
        type: textarea
        size: small
        buttons: false

      approach:
        label: Coaching approach
        type: textarea
        size: small
        buttons: false

      result:
        label: Result
        type: textarea
        size: small
        buttons: false
        help: Only state outcomes you can stand behind. Do not invent race times or PRs.

      description:
        label: Extra story (optional)
        type: textarea
        size: small
        buttons: false
        help: Optional supporting copy below the case-study structure.

      points:
        label: Focus areas
        type: structure
        max: 5
        fields:
          text:
            label: Point
            type: text
            required: true

      image:
        label: Story image
        type: files
        max: 1
        layout: cards
        query: page.files.filterBy("type", "image")
        uploads:
          template: image

      imageAlt:
        label: Image Alt Text
        type: text

      ctaText:
        label: CTA Text
        type: text
        width: 1/2
        default: Book a Free Strategy Call

      ctaLink:
        label: CTA Link
        type: link
        width: 1/2
