name: Reviews
icon: star
preview: fields
wysiwyg: true

fields:
  eyebrow:
    label: Eyebrow
    type: text
    default: Reviews

  heading:
    label: Heading
    type: text
    default: What athletes say

  description:
    label: Description
    type: textarea
    size: small
    buttons: false

  items:
    label: Reviews
    type: structure
    fields:
      quote:
        label: Quote
        type: textarea
        size: medium
        buttons: false
        required: true
      name:
        label: Name
        type: text
        required: true
      role:
        label: Role / result
        type: text
        help: e.g. Marathon PR · 3:42
      rating:
        label: Rating
        type: number
        min: 1
        max: 5
        step: 1
        default: 5
