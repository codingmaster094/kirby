title: Workout Guide
icon: bolt

options:
  preview: "{{ page.url }}"

tabs:
  layout:
    label: Layout
    icon: dashboard
    columns:
      main:
        width: 2/3
        fields:
          layout: fields/layout-sections
      sidebar:
        width: 1/3
        sticky: true
        sections:
          preview:
            type: live-preview
            label: Preview

  content:
    label: Content
    icon: search
    columns:
      main:
        width: 2/3
        fields:
          eyebrow:
            label: Eyebrow
            type: text
            default: Workout Guide
          heading:
            label: Heading
            type: text
            default: Tell us your goal — we’ll show the steps
          description:
            label: Description
            type: textarea
            size: medium
          searchPlaceholder:
            label: Search placeholder
            type: text
            default: e.g. I have belly fat
          searchHelp:
            label: Search help text
            type: text
            default: Type your problem or tap a suggestion below.
          emptyMessage:
            label: No results message
            type: text
            default: No match yet. Try another phrase or pick a suggestion.
          concerns:
            label: Problems & workouts
            type: structure
            help: Each problem can match typed keywords. Add exercises with clear how-to steps.
            fields:
              title:
                label: Problem title
                type: text
                required: true
                placeholder: Belly fat
              keywords:
                label: Keywords
                type: text
                help: Comma-separated. Matched when the user types (e.g. belly fat, tummy, stomach).
                placeholder: belly fat, tummy, stomach fat, abs fat
              summary:
                label: Short summary
                type: textarea
                size: small
                buttons: false
              focus:
                label: What to focus on
                type: textarea
                size: small
                buttons: false
                help: Shown as “Focus on” bullets or paragraph.
              exercises:
                label: Exercises / steps
                type: structure
                fields:
                  name:
                    label: Exercise name
                    type: text
                    required: true
                  how:
                    label: How to do it
                    type: textarea
                    size: small
                    buttons: false
                    required: true
                  sets:
                    label: Sets / reps / time
                    type: text
                    placeholder: 3 sets × 12 reps
                  tip:
                    label: Tip
                    type: text

      sidebar:
        width: 1/3
        sticky: true
        sections:
          preview:
            type: live-preview
            label: Preview
