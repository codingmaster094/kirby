title: Blog

options:
  preview: "{{ page.url }}"
columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          layout: fields/layout-sections
      posts:
        type: pages
        label: Blog Posts
        template: blog-post
        layout: cards
        size: small
  sidebar:
    width: 1/3
    sticky: true
    sections:
      preview:
        type: live-preview
        label: Preview
