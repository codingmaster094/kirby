title: Contact
icon: email

options:
  preview: "{{ page.url }}"

tabs:
  content:
    label: Content
    columns:
      main:
        width: 2/3
        fields:
          eyebrow:
            label: Eyebrow
            type: text
            default: Book a Call
          heading:
            label: Heading
            type: text
            default: Let's build your next breakthrough
          description:
            label: Description
            type: textarea
            size: medium
          email:
            label: Contact email
            type: email
            width: 1/2
            help: Form submissions are emailed here and saved under Inquiries.
          phone:
            label: Phone / WhatsApp
            type: text
            width: 1/2
          points:
            label: What to expect
            type: structure
            fields:
              text:
                label: Point
                type: text

          formHeading:
            label: Form heading
            type: text
            default: Send a message
          formSuccess:
            label: Success message
            type: text
            default: Thanks — we received your message and will get back to you shortly.
          formGoals:
            label: Goal options
            type: structure
            help: Dropdown options on the contact form.
            fields:
              text:
                label: Goal
                type: text

          bookingHeading:
            label: Booking heading
            type: text
            default: Book a strategy call
          bookingDescription:
            label: Booking description
            type: textarea
            size: small
            buttons: false
          bookingUrl:
            label: Booking URL
            type: url
            help: Paste a Calendly (or other scheduler) link. Calendly links embed on the page; other links show a button.

      sidebar:
        width: 1/3
        sticky: true
        sections:
          preview:
            type: live-preview
            label: Preview

  inquiries:
    label: Inquiries
    icon: email
    sections:
      inquiries:
        type: pages
        label: Form inquiries
        templates:
          - inquiry
        status: unlisted
        create: false
        empty: No inquiries yet
