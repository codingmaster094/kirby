title: Blog Post

status:
  draft:
    label: Draft
    text: Blog post is not published yet
  listed:
    label: Published
    text: Blog post is published

tabs:
  layout:
    label: Layout
    icon: dashboard
    columns:
      main:
        width: 2/3
        fields:
          layout: fields/layout-sections
      sidebar:
        width: 1/3
        sticky: true
        sections:
          preview:
            type: live-preview
            label: Preview

  content:
    label: Content
    icon: text
    columns:
      main:
        width: 2/3
        fields:
          description:
            label: Short Description
            type: textarea
            size: medium
          cover:
            label: Cover Image
            type: files
            multiple: false
            layout: cards
            query: page.parent.files.add(page.files)
            uploads:
              parent: page
              template: image
          content:
            label: Content
            type: textarea
            size: large
          website:
            label: External URL
            type: url

      sidebar:
        width: 1/3
        sticky: true
        sections:
          preview:
            type: live-preview
            label: Preview
