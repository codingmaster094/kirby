title: Programs
icon: bolt

options:
  preview: "{{ page.url }}"

columns:
  main:
    width: 2/3
    fields:
      eyebrow:
        label: Eyebrow
        type: text
        default: Coaching Programs
      heading:
        label: Heading
        type: text
        default: Training built around your goals
      description:
        label: Description
        type: textarea
        size: medium
      programs:
        label: Programs
        type: structure
        fields:
          title:
            label: Title
            type: text
            required: true
          summary:
            label: Summary
            type: textarea
            size: small
            buttons: false
          points:
            label: Key points
            type: structure
            fields:
              text:
                label: Point
                type: text
          ctaText:
            label: Button text
            type: text
            default: Book a Call
            width: 1/2
          ctaLink:
            label: Button link
            type: link
            width: 1/2

  sidebar:
    width: 1/3
    sticky: true
    sections:
      preview:
        type: live-preview
        label: Preview
