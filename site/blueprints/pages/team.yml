title: Team

options:
  preview: "{{ page.url }}"

tabs:
  layout:
    label: Layout
    icon: dashboard
    columns:
      main:
        width: 2/3
        fields:
          layout: fields/layout-sections
      sidebar:
        width: 1/3
        sticky: true
        sections:
          preview:
            type: live-preview
            label: Preview

  content:
    label: Content
    icon: users
    columns:
      main:
        width: 2/3
        fields:
          heading:
            label: Heading
            type: text
            default: Our Team

          description:
            label: Description
            type: textarea
            size: medium

          members:
            label: Team Members
            type: blocks
            fieldsets:
              - team-member

      sidebar:
        width: 1/3
        sticky: true
        sections:
          preview:
            type: live-preview
            label: Preview
